# Defendra.AI - Render.com Blueprint for One-Click Demo Deployment
# Usage: 
#   1. Push this file to your GitHub repo
#   2. Go to https://dashboard.render.com/blueprints
#   3. Click "New Blueprint Instance" and select your repo
#   4. Set the required environment variables when prompted

services:
  # ─────────────────────────────────────────────────────────────────────────
  # MySQL Database
  # ─────────────────────────────────────────────────────────────────────────
  - type: pserv
    name: defendra-mysql
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./database/Dockerfile
    dockerContext: ./database
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - key: MYSQL_DATABASE
        value: cyber_resilience_db
      - key: MYSQL_USER
        value: crps_user
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  # ─────────────────────────────────────────────────────────────────────────
  # Backend API (FastAPI)
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: defendra-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: APP_NAME
        value: Defendra.AI
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      # Database connection - uses internal Render hostname
      - key: DATABASE_URL
        value: mysql+pymysql://crps_user:${MYSQL_PASSWORD}@defendra-mysql:3306/cyber_resilience_db
      - key: AUTO_CREATE_TABLES
        value: "true"
      # JWT Authentication
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # CORS - will be updated after frontend deployment
      - key: ALLOWED_ORIGINS
        value: https://defendra-frontend.onrender.com,http://localhost:5173
      # Firebase (optional - can use Firestore or skip for demo)
      - key: FIREBASE_PROJECT_ID
        value: defendraai
      - key: FIRESTORE_EMULATOR_HOST
        value: ""
      - key: FIREBASE_CREDENTIALS_PATH
        value: ""
      # HuggingFace (optional - for Sentinel AI chat)
      - key: HUGGINGFACE_API_KEY
        sync: false  # Set manually in dashboard
      - key: HUGGINGFACE_MODEL
        value: Qwen/Qwen2.5-7B-Instruct
      - key: HUGGINGFACE_LLM_ENABLED
        value: "false"
      # Notifications (optional)
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASSWORD
        value: ""
      - key: NOTIFICATION_FROM_EMAIL
        value: alerts@defendra.ai

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend (React + Vite)
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: defendra-frontend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    numInstances: 1
    envVars:
      - key: VITE_API_URL
        value: https://defendra-backend.onrender.com
      - key: VITE_WS_URL
        value: wss://defendra-backend.onrender.com/ws/dashboard

# ───────────────────────────────────────────────────────────────────────────
# Notes:
# - Free tier services spin down after 15 minutes of inactivity
# - First request after spin-down may take 30-60 seconds
# - Update ALLOWED_ORIGINS and VITE_API_URL with your actual Render URLs
# - Generate a strong JWT_SECRET_KEY (64+ characters)
# ───────────────────────────────────────────────────────────────────────────
