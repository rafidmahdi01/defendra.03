# Defendra.AI - Render.com Blueprint for One-Click Demo Deployment
# Usage: 
#   1. Create a Firebase project at https://console.firebase.google.com
#   2. Enable Firestore Database in the Firebase console
#   3. Generate a service account key (Project Settings > Service Accounts)
#   4. Base64 encode the JSON key: [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes((Get-Content firebase-key.json -Raw)))
#   5. Push this file to your GitHub repo
#   6. Go to https://dashboard.render.com/blueprints
#   7. Click "New Blueprint Instance" and select your repo
#   8. Paste the base64-encoded Firebase credentials when prompted

services:

  # ─────────────────────────────────────────────────────────────────────────
  # Backend API (FastAPI)
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: defendra-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: APP_NAME
        value: Defendra.AI
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      # Firebase/Firestore Configuration
      - key: FIREBASE_PROJECT_ID
        sync: false  # Set manually in dashboard
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false  # Set to base64-encoded service account JSON
      # JWT Authentication
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # CORS - will be updated after frontend deployment
      - key: ALLOWED_ORIGINS
        value: https://defendra-frontend.onrender.com,http://localhost:5173
      # HuggingFace (optional - for Sentinel AI chat)
      - key: HUGGINGFACE_API_KEY
        sync: false  # Set manually in dashboard
      - key: HUGGINGFACE_MODEL
        value: Qwen/Qwen2.5-7B-Instruct
      - key: HUGGINGFACE_LLM_ENABLED
        value: "false"
      # Notifications (optional)
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASSWORD
        value: ""
      - key: NOTIFICATION_FROM_EMAIL
        value: alerts@defendra.ai

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend (React + Vite)
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: defendra-frontend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    numInstances: 1
    envVars:
      - key: VITE_API_URL
        value: https://defendra-backend.onrender.com
      - key: VITE_WS_URL
        value: wss://defendra-backend.onrender.com/ws/dashboard

# ───────────────────────────────────────────────────────────────────────────
# Notes:
# - Free tier services spin down after 15 minutes of inactivity
# - First request after spin-down may take 30-60 seconds
# - Update ALLOWED_ORIGINS and VITE_API_URL with your actual Render URLs
# - Generate a strong JWT_SECRET_KEY (64+ characters)
# - Firebase credentials must be base64-encoded JSON from service account key
# ───────────────────────────────────────────────────────────────────────────
