<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Defendra Browser Monitor</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #0f1419;
        min-width: 480px;
        padding: 0;
        color: #e0e0e0;
      }

      .container {
        background: #0f1419;
        border-radius: 0;
        overflow: hidden;
        border: 1px solid #1a2332;
      }

      .header {
        background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
        border-bottom: 2px solid #00d9a3;
        color: white;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .header-logo {
        width: 36px;
        height: 36px;
        border-radius: 6px;
        object-fit: contain;
        background: rgba(0, 217, 163, 0.1);
        padding: 4px;
        border: 1px solid #00d9a3;
      }

      .header-content h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
        color: #00d9a3;
      }

      .header-content p {
        font-size: 12px;
        opacity: 0.8;
        margin: 2px 0 0;
        color: #888;
      }

      .content {
        padding: 16px;
      }

      .config-section {
        margin-bottom: 16px;
      }

      .config-section label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: #888;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .input-group {
        display: flex;
        gap: 8px;
      }

      input[type="text"] {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid #1a2332;
        border-radius: 4px;
        font-size: 12px;
        font-family: 'Courier New', monospace;
        background: #1a2332;
        color: #00d9a3;
        transition: all 0.3s;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: #00d9a3;
        box-shadow: 0 0 0 2px rgba(0, 217, 163, 0.1);
        background: #182430;
      }

      input[type="text"]::placeholder {
        color: #555;
      }

      .button-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 14px;
      }

      .button-group.full {
        grid-template-columns: 1fr;
      }

      button {
        padding: 11px 14px;
        border: 1px solid #1a2332;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      #saveUrl {
        background: #00d9a3;
        color: #0f1419;
        border-color: #00d9a3;
      }

      #saveUrl:hover {
        background: #00b886;
        border-color: #00b886;
        box-shadow: 0 0 12px rgba(0, 217, 163, 0.3);
      }

      #refresh {
        background: #1a2332;
        color: #00d9a3;
        border-color: #00d9a3;
      }

      #refresh:hover {
        background: #222f3d;
        box-shadow: 0 0 12px rgba(0, 217, 163, 0.2);
      }

      #screenshot {
        background: #1a2332;
        color: #ffa500;
        border-color: #ffa500;
      }

      #screenshot:hover {
        background: #222f3d;
        box-shadow: 0 0 12px rgba(255, 165, 0, 0.2);
      }

      #options {
        background: #1a2332;
        color: #00d9a3;
        border-color: #00d9a3;
        grid-column: 1 / -1;
      }

      #options:hover {
        background: #222f3d;
        box-shadow: 0 0 12px rgba(0, 217, 163, 0.2);
      }

      .events-container {
        margin-top: 16px;
        padding: 12px;
        background: #1a2332;
        border-radius: 4px;
        max-height: 380px;
        overflow-y: auto;
        border: 1px solid #0f1419;
      }

      .events-header {
        font-size: 11px;
        font-weight: 600;
        color: #888;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .event {
        padding: 10px;
        margin-bottom: 8px;
        background: #0f1419;
        border-left: 3px solid #00d9a3;
        border-radius: 2px;
        font-size: 11px;
        transition: all 0.3s;
      }

      .event:hover {
        background: #151a24;
        box-shadow: 0 0 8px rgba(0, 217, 163, 0.1);
      }

      .event-reason {
        font-weight: 600;
        color: #00d9a3;
        margin-bottom: 4px;
      }

      .event-time {
        font-size: 10px;
        color: #666;
        margin-bottom: 4px;
      }

      .event-url {
        font-size: 10px;
        color: #00d9a3;
        word-break: break-all;
        margin-bottom: 4px;
        opacity: 0.7;
      }

      .event-snippet {
        font-size: 10px;
        color: #999;
        background: #151a24;
        padding: 6px;
        border-radius: 2px;
        word-break: break-word;
        border-left: 2px solid #ffa500;
      }

      .no-events {
        text-align: center;
        padding: 20px 10px;
        color: #666;
        font-size: 12px;
      }

      .no-events-icon {
        font-size: 32px;
        margin-bottom: 8px;
        opacity: 0.5;
      }

      /* Scrollbar styling */
      .events-container::-webkit-scrollbar {
        width: 6px;
      }

      .events-container::-webkit-scrollbar-track {
        background: #1a2332;
        border-radius: 2px;
      }

      .events-container::-webkit-scrollbar-thumb {
        background: #00d9a3;
        border-radius: 2px;
      }

      .events-container::-webkit-scrollbar-thumb:hover {
        background: #00b886;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <img src="defendra-logo.png" alt="Defendra" class="header-logo" />
        <div class="header-content">
          <h1>Defendra Monitor</h1>
          <p>Browser Security</p>
        </div>
      </div>

      <div class="content">
        <div class="config-section">
          <label>Backend API Endpoint</label>
          <div class="input-group">
            <input id="backendUrl" type="text" placeholder="http://127.0.0.1:8000/api/logs" />
          </div>
          <div class="button-group full">
            <button id="saveUrl">💾 Save Configuration</button>
          </div>
        </div>

        <div class="button-group">
          <button id="refresh">🔄 Refresh Events</button>
          <button id="screenshot">📸 Capture Screen</button>
        </div>

        <div class="button-group full">
          <button id="options">⚙️ Settings & Permissions</button>
        </div>

        <div class="events-container">
          <div class="events-header">Recent Security Events</div>
          <div id="events"></div>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
